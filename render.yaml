services:
  - type: web
    name: linkplease
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: START_BACKGROUND_WORKERS
        value: "true"
      - key: VERIFY_SIGNATURES
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "9"
      - key: MAX_SEND_ATTEMPTS
        value: "10"

databases:
  - name: linkplease-db
    plan: free
